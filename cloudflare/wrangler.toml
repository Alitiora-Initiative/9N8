name = "9n8-cloudflare"
main = "src/index.js"
compatibility_date = "2026-11-25"
workers_dev = true
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "9n8-db"
database_id = "00000000-0000-0000-0000-000000000000" # Replace with the real D1 database ID before deploying
migrations_dir = "migrations"

[triggers]
crons = ["* * * * *"]

[observability]
enabled = true
