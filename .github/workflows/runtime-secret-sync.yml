name: 9N8 runtime secret sync

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 9n8-runtime-secret-sync
  cancel-in-progress: false

jobs:
  sync-runtime-secrets:
    name: Sync GitHub credentials to production runtimes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Non-secret routing identifiers only. Credentials are scoped to individual steps.
      SUPABASE_PROJECT_REF: qlfcazdfxexcnzdgpqqm
      VERCEL_PROJECT_ID: prj_XRNfMHxy12MsqJ0cuTvhAYmYGhh6
      VERCEL_TEAM_ID: team_Mlpz0l6o2HlH9tE8hetluFH3

    steps:
      - name: Validate required credentials and runtime safety
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_WEBHOOK_URL: ${{ secrets.TELEGRAM_WEBHOOK_URL }}
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          JUPITER_API_KEY: ${{ secrets.JUPITER_API_KEY }}
          MASTER_TREASURY_ADDRESS: ${{ vars.MASTER_TREASURY_ADDRESS }}
        run: |
          set -euo pipefail
          missing=()
          for name in SUPABASE_ACCESS_TOKEN VERCEL_TOKEN TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID TELEGRAM_WEBHOOK_URL HELIUS_API_KEY JUPITER_API_KEY; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required repository Actions secrets: %s\n' "${missing[*]}" >&2
            echo "Add the missing values under Settings → Secrets and variables → Actions, then run this workflow again." >&2
            exit 1
          fi

          if [[ ! "$TELEGRAM_CHAT_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "TELEGRAM_CHAT_ID must be the positive numeric Telegram user/chat ID used by the Python worker." >&2
            exit 1
          fi

          expected_webhook_url="https://qlfcazdfxexcnzdgpqqm.supabase.co/functions/v1/telegram-bot-next"
          if [[ "$TELEGRAM_WEBHOOK_URL" != "$expected_webhook_url" ]]; then
            echo "TELEGRAM_WEBHOOK_URL must point to the canonical telegram-bot-next endpoint." >&2
            exit 1
          fi

          if [[ -n "$MASTER_TREASURY_ADDRESS" ]]; then
            python - <<'PY'
          import os
          alphabet = "123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz"
          value = os.environ["MASTER_TREASURY_ADDRESS"].strip()
          if not value or any(char not in alphabet for char in value):
              raise SystemExit("MASTER_TREASURY_ADDRESS is not valid base58")
          number = 0
          for char in value:
              number = number * 58 + alphabet.index(char)
          decoded = number.to_bytes((number.bit_length() + 7) // 8, "big") if number else b""
          decoded = (b"\x00" * (len(value) - len(value.lstrip("1")))) + decoded
          if len(decoded) != 32:
              raise SystemExit("MASTER_TREASURY_ADDRESS must decode to exactly 32 bytes")
          PY
          else
            echo "::warning::MASTER_TREASURY_ADDRESS is not set as a GitHub Actions variable. Treasury fee transfers remain disabled until the local Linux key generator is run and its public address is added."
          fi

          echo "Validated provider credentials, Telegram destination, and the canonical webhook URL."

      - name: Verify Jupiter Swap V2 API key with a quote-only request
        shell: bash
        env:
          JUPITER_API_KEY: ${{ secrets.JUPITER_API_KEY }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          query = urllib.parse.urlencode({
              "inputMint": "So11111111111111111111111111111111111111112",
              "outputMint": "EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v",
              "amount": "100000000",
          })
          request = urllib.request.Request(
              "https://api.jup.ag/swap/v2/order?" + query,
              headers={
                  "Accept": "application/json",
                  "x-api-key": os.environ["JUPITER_API_KEY"],
              },
              method="GET",
          )
          try:
              with urllib.request.urlopen(request, timeout=15) as response:
                  payload = json.loads(response.read().decode("utf-8"))
                  if response.status != 200 or int(payload.get("outAmount", "0")) <= 0:
                      raise SystemExit("Jupiter returned no valid quote; response values were suppressed.")
          except urllib.error.HTTPError as error:
              if error.code in (401, 403):
                  raise SystemExit("Jupiter rejected the API key (authentication failed).") from None
              if error.code == 429:
                  raise SystemExit("Jupiter API is rate limited; rerun after the provider limit resets.") from None
              raise SystemExit(f"Jupiter quote check failed (HTTP {error.code}); response details were suppressed.") from None
          except (urllib.error.URLError, TimeoutError, ValueError, KeyError):
              raise SystemExit("Jupiter quote check could not complete; response details were suppressed.") from None
          print("Jupiter Swap V2 authenticated quote-only check passed; no wallet, signature, or transaction was used.")
          PY

      - name: Verify Telegram Bot API token before rotating the webhook secret
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          url = "https://api.telegram.org/bot" + os.environ["TELEGRAM_BOT_TOKEN"] + "/getMe"
          request = urllib.request.Request(url, headers={"Accept": "application/json"}, method="GET")
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  result = json.loads(response.read().decode("utf-8"))
          except (urllib.error.URLError, TimeoutError, ValueError):
              raise SystemExit("Telegram Bot API preflight failed; response details were suppressed.") from None
          if result.get("ok") is not True or result.get("result", {}).get("is_bot") is not True:
              raise SystemExit("Telegram rejected the configured bot token; the production webhook was not changed.")
          print("Telegram Bot API token preflight passed; webhook has not yet been changed.")
          PY

      - name: Generate one-run Telegram webhook secret
        shell: bash
        run: |
          set -euo pipefail
          webhook_secret="$(python -c 'import secrets; print(secrets.token_hex(32))')"
          echo "::add-mask::$webhook_secret"
          printf 'TELEGRAM_WEBHOOK_SECRET=%s\n' "$webhook_secret" >> "$GITHUB_ENV"
          unset webhook_secret
          echo "Generated a fresh 256-bit Telegram webhook secret for this synchronization run; its value is masked and not stored in the repository."

      - name: Install Supabase CLI
        run: npx --yes supabase@latest --version

      - name: Sync Telegram and Jupiter secrets to Supabase Edge Functions
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          JUPITER_API_KEY: ${{ secrets.JUPITER_API_KEY }}
        run: |
          set -euo pipefail
          umask 077
          secret_file="$RUNNER_TEMP/9n8-supabase-edge-secrets.env"
          trap 'rm -f "$secret_file"' EXIT
          python - <<'PY'
          import os
          from pathlib import Path
          keys = ("TELEGRAM_BOT_TOKEN", "TELEGRAM_WEBHOOK_SECRET", "JUPITER_API_KEY")
          lines = []
          for key in keys:
              value = os.environ.get(key, "")
              if not value or "\n" in value or "\r" in value:
                  raise SystemExit(f"Required runtime value is missing or malformed: {key}")
              lines.append(f"{key}={value}")
          path = Path(os.environ["RUNNER_TEMP"]) / "9n8-supabase-edge-secrets.env"
          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          path.chmod(0o600)
          PY
          npx --yes supabase@latest secrets set \
            --env-file "$secret_file" \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --yes
          echo "Supabase Edge Function secrets synchronized by name; values were not printed."

      - name: Deploy the production Telegram Edge Function
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes supabase@latest functions deploy telegram-bot-next \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --no-verify-jwt \
            --yes
          echo "Deployed only telegram-bot-next with the existing Telegram-header authentication model."

      - name: Verify Supabase runtime sees Telegram secrets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import urllib.error
          import urllib.request

          url = "https://qlfcazdfxexcnzdgpqqm.supabase.co/functions/v1/telegram-bot-next"
          request = urllib.request.Request(url, headers={"Accept": "application/json"}, method="GET")
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  payload = json.loads(response.read().decode("utf-8"))
          except (urllib.error.URLError, TimeoutError, ValueError):
              raise SystemExit("Supabase Telegram function health check failed; response details were suppressed.") from None
          config = payload.get("config", {})
          if payload.get("ok") is not True or config.get("telegramTokenConfigured") is not True or config.get("webhookSecretConfigured") is not True:
              raise SystemExit("Supabase Telegram function does not report both Telegram runtime secrets as configured.")
          print("Supabase telegram-bot-next is deployed and confirms both Telegram runtime secrets are present.")
          PY

      - name: Register and verify the production Telegram webhook
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_URL: ${{ secrets.TELEGRAM_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          secret = os.environ["TELEGRAM_WEBHOOK_SECRET"]
          webhook_url = os.environ["TELEGRAM_WEBHOOK_URL"]

          def call(method, payload=None):
              url = f"https://api.telegram.org/bot{token}/{method}"
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              request = urllib.request.Request(
                  url,
                  data=data,
                  headers={"Content-Type": "application/json"} if data is not None else {},
                  method="GET" if data is None else "POST",
              )
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      result = json.loads(response.read().decode("utf-8"))
              except (urllib.error.URLError, TimeoutError, ValueError):
                  raise SystemExit(f"Telegram {method} connectivity check failed; response details were suppressed.")
              if result.get("ok") is not True:
                  raise SystemExit(f"Telegram {method} was rejected; response details were suppressed.")
              return result.get("result")

          call("setWebhook", {
              "url": webhook_url,
              "secret_token": secret,
              "allowed_updates": ["message", "callback_query", "my_chat_member", "chat_member"],
              "drop_pending_updates": False,
          })
          info = call("getWebhookInfo")
          if info.get("url") != webhook_url:
              raise SystemExit("Telegram webhook verification failed: Telegram reports a different endpoint.")
          print("Telegram Bot API authenticated; webhook endpoint is registered and verified.")
          print("Webhook:", webhook_url)
          print("Pending updates:", int(info.get("pending_update_count", 0)))
          PY

      - name: Sync worker credentials to the correct Vercel backend project
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          JUPITER_API_KEY: ${{ secrets.JUPITER_API_KEY }}
          MASTER_TREASURY_ADDRESS: ${{ vars.MASTER_TREASURY_ADDRESS }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          token = os.environ["VERCEL_TOKEN"]
          team_id = os.environ["VERCEL_TEAM_ID"]
          project_id = os.environ["VERCEL_PROJECT_ID"]
          base = f"https://api.vercel.com/v10/projects/{project_id}/env"
          query = urllib.parse.urlencode({"teamId": team_id, "decrypt": "false"})

          def request(method, url, payload=None):
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              req = urllib.request.Request(
                  url,
                  data=data,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Content-Type": "application/json",
                  },
                  method=method,
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      raw = response.read()
                      return json.loads(raw.decode("utf-8")) if raw else {}
              except urllib.error.HTTPError as error:
                  # Never print an API response body: it may contain configuration data.
                  raise SystemExit(f"Vercel environment API rejected {method} (HTTP {error.code}).")
              except (urllib.error.URLError, TimeoutError, ValueError):
                  raise SystemExit(f"Vercel environment API failed during {method}; details were suppressed.")

          # Fail closed if someone has changed the production trading safety locks.
          current = request("GET", base + "?" + query)
          envs = current.get("envs", [])
          def production_value(name):
              for item in envs:
                  if item.get("key") == name and "production" in item.get("target", []):
                      return str(item.get("value", "")).strip().lower()
              return None

          if production_value("N9N8_TRADING_MODE") != "paper":
              raise SystemExit("Safety stop: 9n8-python-engine Production must keep N9N8_TRADING_MODE=paper.")
          if production_value("LIVE_TRADING_ENABLED") != "false":
              raise SystemExit("Safety stop: 9n8-python-engine Production must keep LIVE_TRADING_ENABLED=false.")

          def upsert(name, value, kind="encrypted"):
              payload = {
                  "key": name,
                  "value": value,
                  "type": kind,
                  "target": ["production"],
              }
              request("POST", base + "?" + urllib.parse.urlencode({
                  "teamId": team_id,
                  "upsert": "true",
              }), payload)
              print(f"Synced Vercel Production variable: {name}")

          for name in ("TELEGRAM_BOT_TOKEN", "TELEGRAM_CHAT_ID", "HELIUS_API_KEY", "JUPITER_API_KEY"):
              value = os.environ.get(name, "").strip()
              if not value or "\n" in value or "\r" in value:
                  raise SystemExit(f"Missing or malformed Vercel runtime source: {name}")
              upsert(name, value)

          treasury = os.environ.get("MASTER_TREASURY_ADDRESS", "").strip()
          if treasury:
              upsert("MASTER_TREASURY_ADDRESS", treasury, "plain")
          else:
              print("Treasury address not synced: MASTER_TREASURY_ADDRESS Actions variable is not set.")

          # Verify only names and production targets, never decrypt values.
          verified = request("GET", base + "?" + query).get("envs", [])
          required = {"TELEGRAM_BOT_TOKEN", "TELEGRAM_CHAT_ID", "HELIUS_API_KEY", "JUPITER_API_KEY"}
          present = {
              item.get("key")
              for item in verified
              if "production" in item.get("target", [])
          }
          missing = sorted(required - present)
          if missing:
              raise SystemExit("Vercel Production environment verification failed for: " + ", ".join(missing))
          print("Vercel Production environment names and targets verified.")
          print("Paper/live safety locks were checked and left unchanged.")
          PY

      - name: Deploy the updated Python engine to Vercel Production
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          token = os.environ["VERCEL_TOKEN"]
          team_id = os.environ["VERCEL_TEAM_ID"]
          project_id = os.environ["VERCEL_PROJECT_ID"]
          query = urllib.parse.urlencode({"teamId": team_id, "forceNew": "1"})
          url = "https://api.vercel.com/v13/deployments?" + query
          payload = {
              "name": "9n8-python-engine",
              "project": project_id,
              "target": "production",
              "gitSource": {
                  "type": "github",
                  "org": "Alitiora-Initiative",
                  "repo": "9N8",
                  "ref": "main",
                  "sha": os.environ["GITHUB_SHA"],
              },
              "meta": {
                  "runtimeSecretSync": "true",
                  "sourceBranch": "main",
              },
          }
          request = urllib.request.Request(
              url,
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Authorization": "Bearer " + token,
                  "Content-Type": "application/json",
                  "Accept": "application/json",
              },
              method="POST",
          )
          try:
              with urllib.request.urlopen(request, timeout=45) as response:
                  result = json.loads(response.read().decode("utf-8"))
          except urllib.error.HTTPError as error:
              raise SystemExit(f"Vercel Production deployment request failed (HTTP {error.code}); response details were suppressed.") from None
          except (urllib.error.URLError, TimeoutError, ValueError):
              raise SystemExit("Vercel Production deployment request failed; response details were suppressed.") from None

          deployment_id = str(result.get("id") or "")
          deployment_url = str(result.get("url") or "")
          state = str(result.get("readyState") or result.get("state") or "QUEUED")
          if not deployment_id or not deployment_url:
              raise SystemExit("Vercel did not return a deployment ID and URL.")
          print("Created 9n8-python-engine Production deployment:", deployment_id)
          print("Deployment URL:", "https://" + deployment_url)
          print("Initial deployment state:", state)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("\n## Vercel Production deployment\n")
              summary.write(f"- Deployment: `{deployment_id}`\n")
              summary.write(f"- URL: https://{deployment_url}\n")
              summary.write(f"- Initial state: `{state}`\n")
          PY

      - name: Write a safe run summary
        if: always()
        shell: bash
        run: |
          {
            echo "## 9N8 runtime secret sync"
            echo
            echo "- Supabase target: `telegram-bot-next` in project `$SUPABASE_PROJECT_REF`"
            echo "- Vercel target: `9n8-python-engine` Production"
            echo "- Telegram webhook: canonical `telegram-bot-next` endpoint"
            echo "- Live trading locks: workflow requires `N9N8_TRADING_MODE=paper` and `LIVE_TRADING_ENABLED=false`"
            echo "- Treasury address: supplied only through the non-secret Actions variable `MASTER_TREASURY_ADDRESS`"
            echo "- Telegram webhook secret: freshly generated, masked, and synchronized during this run"
            echo "- No secret values or wallet private keys are written to the summary"
            echo
            echo "Vercel Production receives a new deployment after its environment variables are synchronized."
          } >> "$GITHUB_STEP_SUMMARY"
