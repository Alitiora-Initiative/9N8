name: 9N8 Telegram Signal Bot

on:
  workflow_dispatch:
  schedule:
    # GitHub-hosted runners are best-effort; scheduled runs can be delayed.
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: 9n8-telegram-signal-bot
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Restore bot state
        uses: actions/cache@v4
        with:
          path: .state/state.json
          key: 9n8-state-\${{ github.run_id }}-\${{ github.run_attempt }}
          restore-keys: |
            9n8-state-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Telegram bot and scheduled scan
        env:
          TELEGRAM_BOT_TOKEN: \${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: \${{ secrets.TELEGRAM_CHAT_ID }}
          TWELVE_DATA_API_KEY: \${{ secrets.TWELVE_DATA_API_KEY }}
          N8_SYMBOLS: \${{ vars.N8_SYMBOLS }}
          N8_INTERVAL: 15min
          N8_SCAN_EVERY_MINUTES: 15
          N8_OUTPUTSIZE: 150
        run: python bot.py
