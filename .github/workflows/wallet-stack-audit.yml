name: 9N8 wallet stack security upgrade
on:
  push:
    branches: [fix/9n8-wallet-stack-security-upgrade]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  statuses: write

jobs:
  web-wallet-stack:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Build, audit and lock wallet dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package.json
      - name: Install wallet dependencies before audited lock update
        working-directory: web
        run: npm install --no-audit --no-fund
      - name: Apply compatible non-breaking security updates
        working-directory: web
        shell: bash
        run: |
          npm audit fix --no-fund || {
            echo "::warning::Some upstream advisories cannot be fixed automatically without a breaking upgrade. The next audit gate will distinguish fixable from unfixable findings."
          }
      - name: Verify clean lockfile install after safe updates
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: Test Solana v3 versioned transaction round-trip
        working-directory: web
        run: npm run test:wallet-transaction
      - name: Audit complete dependency graph and enforce available fixes
        working-directory: web
        shell: bash
        run: |
          npm audit --json > npm-audit-report.json || true
          node --input-type=commonjs <<'NODE'
          const fs = require("node:fs");
          const report = JSON.parse(fs.readFileSync("npm-audit-report.json", "utf8"));
          const counts = report.metadata?.vulnerabilities ?? {};
          const entries = Object.entries(report.vulnerabilities ?? {});
          const high = Number(counts.high ?? 0);
          const critical = Number(counts.critical ?? 0);
          const total = Number(counts.total ?? 0);
          console.log("Web dependency audit:", JSON.stringify(counts));
          for (const [name, item] of entries) {
            console.log(
              item.severity.toUpperCase(),
              name + "@" + item.range,
              "fix=" + JSON.stringify(item.fixAvailable ?? false),
              "direct=" + String(item.isDirect),
            );
          }
          const summary = [
            "## Web dependency audit after compatible, non-breaking update",
            "",
            `Total: ${counts.total ?? 0} · Critical: ${critical} · High: ${counts.high ?? 0} · Moderate: ${counts.moderate ?? 0} · Low: ${counts.low ?? 0}`,
            `Unresolved vulnerabilities: ${total}`,
            "",
            "Unfixed upstream findings are reported, not suppressed. Major-version overrides are not applied automatically.",
            "",
            ...entries.map(([name, item]) =>
              `- **${item.severity.toUpperCase()}** ${name}@${item.range} — fix: ${JSON.stringify(item.fixAvailable ?? false)} · direct: ${item.isDirect}`
            )
          ];
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary.join("\\n") + "\\n");
          if (total > 0 || high > 0 || critical > 0) {
            console.error("Blocking dependency audit: npm reported unresolved vulnerabilities.");
            process.exit(1);
          }
          NODE
      - name: Commit tested package lock to the PR branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          PR_BRANCH: ${{ github.head_ref }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        working-directory: web
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(web): lock wallet stack dependencies"
            git push origin "HEAD:${PR_BRANCH}"
          else
            echo "package-lock.json is already up to date."
          fi
          LOCK_SHA="$(git rev-parse HEAD)"
          curl --fail-with-body --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/statuses/${LOCK_SHA}" \
            -d '{"state":"success","description":"Clean npm ci install, Vite build and RPC smoke test passed; audit report uploaded.","context":"9N8 wallet lockfile clean install"}'
      - name: Upload dependency lockfile and audit report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: 9n8-wallet-stack-lock-and-audit
          path: |
            web/package-lock.json
            web/npm-audit-report.json
          if-no-files-found: warn
          retention-days: 7
