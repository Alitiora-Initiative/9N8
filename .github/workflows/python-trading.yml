name: 9N8 Python multi-asset checks

on:
  push:
    branches: [multi-asset-python]
  pull_request:
    branches: [main, paper-trading-pilot, multi-asset-python]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile all Python modules
        run: python -m compileall -q main.py config.py models.py storage.py connectors strategies risk_manager security core tests
      - name: Run unit tests
        run: pytest -q
