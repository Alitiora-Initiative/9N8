name: Expand initial 9N8 source bundle
on:
  push:
    paths:
      - ".bootstrap/9n8-source.zip.b64"
permissions:
  contents: write
jobs:
  expand:
    if: github.event.head_commit.message != 'Expand 9N8 source bundle'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Safely expand source archive
        run: |
          python - <<'PY'
          import base64, io, pathlib, zipfile
          root = pathlib.Path('.').resolve()
          archive_path = pathlib.Path('.bootstrap/9n8-source.zip.b64')
          raw = base64.b64decode(archive_path.read_bytes(), validate=True)
          with zipfile.ZipFile(io.BytesIO(raw)) as archive:
              for item in archive.infolist():
                  target = (root / item.filename).resolve()
                  if target != root and root not in target.parents:
                      raise SystemExit('Unsafe archive path rejected')
                  if item.is_dir():
                      target.mkdir(parents=True, exist_ok=True)
                  else:
                      target.parent.mkdir(parents=True, exist_ok=True)
                      target.write_bytes(archive.read(item))
          archive_path.unlink()
          PY
      - name: Commit expanded project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No expanded files to commit."
          else
            git commit -m "Expand 9N8 source bundle"
            git push origin HEAD:main
          fi
