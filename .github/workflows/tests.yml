name: 9N8 tests

on:
  push:
    branches: [main, exchange-api, universal-multi-user]
  pull_request:
    branches: [main, exchange-api, universal-multi-user]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    name: Legacy Python bot tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pytest
      - run: python -m compileall -q src tests
      - run: python -c "import src.bot"
      - run: python -m pytest -q

  web-build:
    name: Web app production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm install --no-audit --no-fund
      - name: Build web app
        working-directory: web
        run: npm run build

  deno-tests:
    name: Deno paper and Binance connector tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run paper-engine tests
        run: deno test supabase/functions/n8-paper-worker/paper-engine_test.ts
      - name: Run Binance live connector safety tests
        run: deno test supabase/functions/telegram-bot-next/binance-live_test.ts
