name: 9N8 tests
on:
  push:
    branches: [main, exchange-api, universal-multi-user, paper-trading-pilot]
  pull_request:
    branches: [main, exchange-api, universal-multi-user, paper-trading-pilot]
permissions:
  contents: read
jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pytest
      - run: python -m compileall -q src tests
      - run: python -c "import src.bot"
      - run: python -m pytest -q
  paper-engine-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno test --no-check supabase/functions/_shared/paper-engine_test.ts
      - run: deno check supabase/functions/n8-paper-worker/index.ts
      - run: deno check supabase/functions/telegram-bot-next/index.ts
