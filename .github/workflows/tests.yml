name: 9N8 Solana tests
on:
  push:
    branches: [main, feature/solana-telegram-sniper, feature/9n8-neon-platform-split, feature/solana-live-controls-completion, feature/9n8-telegram-network-controls]
  pull_request:
    branches: [main, feature/solana-live-controls-completion]
  workflow_dispatch:
permissions:
  contents: read

jobs:
  python-tests:
    name: Legacy Python bot tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pytest pytest-asyncio httpx
      - run: python -m compileall -q src tests
      - run: python -c "import src.n9n8.main"
      - run: python -m pytest -q

  web-build:
    name: Web app production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install web dependencies
        working-directory: web
        run: npm install --no-audit --no-fund
      - name: Build web app
        working-directory: web
        run: npm run build

  deno-tests:
    name: Deno paper and Binance connector tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run paper-engine tests
        run: deno test supabase/functions/n8-paper-worker/paper-engine_test.ts
      - name: Run Binance live connector safety tests
        run: deno test supabase/functions/telegram-bot-next/binance-live_test.ts
      - name: Run OKX API permission safety tests
        run: deno test supabase/functions/telegram-bot-next/okx-live_test.ts
      - name: Run universal exchange product permission tests
        run: deno test supabase/functions/telegram-bot-next/exchange-permissions_test.ts
      - name: Run Jupiter Swap V2 safety tests
        run: deno test supabase/functions/telegram-bot-next/jupiter-live_test.ts
      - name: Type-check Supabase edge functions
        run: deno check supabase/functions/telegram-bot-next/index.ts supabase/functions/n8-paper-worker/index.ts

  # Send backend secrets only to a dedicated backend project, never the public Vite frontend.
  sync-production-runtime:
    name: Sync backend runtime secrets to Vercel
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.event.head_commit.message == 'Sync 9N8 production runtime environment')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: true
      - name: Validate and sync runtime secrets without printing values
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_BACKEND_PROJECT_ID: ${{ vars.VERCEL_BACKEND_PROJECT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          AUTHORIZED_USER_ID: ${{ secrets.AUTHORIZED_USER_ID }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          MASTER_TREASURY_ADDRESS: ${{ secrets.MASTER_TREASURY_ADDRESS }}
          ENCRYPTION_MASTER_KEY: ${{ secrets.ENCRYPTION_MASTER_KEY }}
          JUPITER_API_KEY: ${{ secrets.JUPITER_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          project = os.environ.get("VERCEL_BACKEND_PROJECT_ID", "").strip()
          frontend_project = "prj_ArbUq9ud6TwcO7r89DiQjed604Ue"
          team = "team_Mlpz0l6o2HlH9tE8hetluFH3"
          if not re.fullmatch(r"prj_[A-Za-z0-9]+", project) or project == frontend_project:
              print("Set GitHub Actions variable VERCEL_BACKEND_PROJECT_ID to a dedicated backend Vercel project ID. Refusing to sync backend secrets into the frontend project.")
              sys.exit(1)
          token = os.environ.get("VERCEL_TOKEN", "").strip()
          authorized = (os.environ.get("AUTHORIZED_USER_ID", "").strip()
                        or os.environ.get("TELEGRAM_CHAT_ID", "").strip())
          values = {
              "TELEGRAM_BOT_TOKEN": os.environ.get("TELEGRAM_BOT_TOKEN", "").strip(),
              "AUTHORIZED_USER_ID": authorized,
              "HELIUS_API_KEY": os.environ.get("HELIUS_API_KEY", "").strip(),
              "MASTER_TREASURY_ADDRESS": os.environ.get("MASTER_TREASURY_ADDRESS", "").strip(),
              "ENCRYPTION_MASTER_KEY": os.environ.get("ENCRYPTION_MASTER_KEY", "").strip(),
          }
          optional = {
              "JUPITER_API_KEY": os.environ.get("JUPITER_API_KEY", "").strip(),
          }
          missing = [name for name, value in values.items() if not value]
          if not token:
              missing.append("VERCEL_TOKEN")
          if authorized and not re.fullmatch(r"[0-9]+", authorized):
              print("AUTHORIZED_USER_ID/TELEGRAM_CHAT_ID must be a positive private Telegram user ID.")
              sys.exit(1)
          if missing:
              print("Runtime sync not run. Missing GitHub Actions secrets: " + ", ".join(missing))
              print("Add the named secrets and VERCEL_BACKEND_PROJECT_ID variable to the 9N8 repository, then rerun this workflow.")
              sys.exit(1)

          endpoint = ("https://api.vercel.com/v10/projects/" + project +
                      "/env?upsert=true&teamId=" + urllib.parse.quote(team, safe=""))
          headers = {
              "Authorization": "Bearer " + token,
              "Content-Type": "application/json",
          }
          synced = []
          for name, value in {**values, **{k: v for k, v in optional.items() if v}}.items():
              body = json.dumps({
                  "key": name,
                  "value": value,
                  "type": "sensitive",
                  "target": ["production"],
              }).encode("utf-8")
              request = urllib.request.Request(endpoint, data=body, headers=headers, method="POST")
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      if response.status not in (200, 201):
                          raise RuntimeError("unexpected_http_status")
                      response.read()
                  synced.append(name)
              except urllib.error.HTTPError as error:
                  print("Vercel rejected the environment update for " + name + " (HTTP " + str(error.code) + ").")
                  sys.exit(1)
              except Exception as error:
                  print("Environment update failed for " + name + " (" + type(error).__name__ + ").")
                  sys.exit(1)
          print("Synced sensitive production variables to Vercel: " + ", ".join(synced))
          print("Existing encryption key was copied unchanged. Paper mode and live-trading lock were not modified.")
          PY
      - name: Trigger Vercel Git deployment after environment sync
        run: |
          mkdir -p ops
          printf 'Production runtime variables synchronized by workflow run %s at %s.\n' "$GITHUB_RUN_ID" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > ops/production-runtime-env-sync.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops/production-runtime-env-sync.md
          git commit -m "Trigger Vercel deployment after runtime environment sync"
          git push origin HEAD:main
