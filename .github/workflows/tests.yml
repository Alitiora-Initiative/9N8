name: 9N8 Solana tests
on:
  push:
    branches: [main, feature/solana-telegram-sniper, feature/9n8-neon-platform-split, feature/solana-live-controls-completion, feature/9n8-telegram-network-controls, feat/noncustodial-wallet-rebuild]
  pull_request:
    branches: [main, feature/solana-live-controls-completion]
  workflow_dispatch:
permissions:
  contents: read

jobs:
  python-tests:
    name: Legacy Python bot tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pytest pytest-asyncio httpx
      - run: python -m compileall -q src tests
      - run: python -c "import src.n9n8.main"
      - run: python -m pytest -o asyncio_default_fixture_loop_scope=function -q

  web-build:
    name: Web app production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install web dependencies
        working-directory: web
        run: npm install --no-audit --no-fund
      - name: Report npm dependency advisories
        working-directory: web
        run: |
          npm audit --json > /tmp/9n8-npm-audit.json || true
          node - <<'NODE'
          const fs = require("node:fs");
          const report = JSON.parse(fs.readFileSync("/tmp/9n8-npm-audit.json", "utf8"));
          const counts = report.metadata?.vulnerabilities ?? {};
          const findings = Object.entries(report.vulnerabilities ?? {}).map(([name, item]) => ({
            name,
            severity: item.severity,
            direct: item.isDirect,
            range: item.range,
            fixAvailable: item.fixAvailable,
            advisories: (item.via ?? []).filter((v) => typeof v === "object").map((v) => ({
              title: v.title,
              url: v.url,
              range: v.range
            }))
          }));
          console.log("NPM AUDIT SUMMARY:", JSON.stringify(counts));
          console.log("NPM AUDIT FINDINGS:", JSON.stringify(findings, null, 2));
          NODE
      - name: Test client-side wallet derivation and encrypted backup
        working-directory: web
        run: npm run test:wallet-vault
      - name: Test Jupiter transaction serialization
        working-directory: web
        run: npm run test:wallet-transaction
      - name: Build web app
        working-directory: web
        run: npm run build

  deno-tests:
    name: Deno paper and Binance connector tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run paper-engine tests
        run: deno test supabase/functions/n8-paper-worker/paper-engine_test.ts
      - name: Run Binance live connector safety tests
        run: deno test supabase/functions/telegram-bot-next/binance-live_test.ts
      - name: Run OKX API permission safety tests
        run: deno test supabase/functions/telegram-bot-next/okx-live_test.ts
      - name: Run universal exchange product permission tests
        run: deno test supabase/functions/telegram-bot-next/exchange-permissions_test.ts
      - name: Run Jupiter Swap V2 safety tests
        run: deno test supabase/functions/telegram-bot-next/jupiter-live_test.ts
      - name: Run Telegram UI and menu tests
        run: deno test supabase/functions/telegram-bot-next/telegram-ui_test.ts
      - name: Run chain and broker registry tests
        run: deno test supabase/functions/telegram-bot-next/networks_test.ts
      - name: Type-check Supabase edge functions
        run: deno check supabase/functions/telegram-bot-next/index.ts supabase/functions/n8-paper-worker/index.ts supabase/functions/wallet-vault/index.ts
