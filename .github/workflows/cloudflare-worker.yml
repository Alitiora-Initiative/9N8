name: 9N8 Cloudflare Worker checks

on:
  push:
    branches: [cloudflare-worker]
    paths:
      - "cloudflare/**"
      - ".github/workflows/cloudflare-worker.yml"
  pull_request:
    paths:
      - "cloudflare/**"
      - ".github/workflows/cloudflare-worker.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Worker logic tests
        run: npm test
